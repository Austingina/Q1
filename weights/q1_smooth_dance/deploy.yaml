policy:
  file: policy.onnx
  inputs:
    obs:
    - null
    - 720
    goal:
    - null
    - 546
  outputs:
    action:
    - null
    - 22
    joint_target:
    - null
    - 22
  joint_target: default_joint_pos + action_scale * action（rad），作为 PD 目标
  normalization: 无：观测缩放已在网络内部，直接喂原始量
obs:
  history: 10
  layout: 按项分块（term-major）：每一项连续放 history 帧，帧顺序从旧到新；回合开始时所有历史帧都填第一帧
  terms:
  - name: joint_pos
    dim: 22
    unit: rad
    desc: 关节编码器角度减默认站姿 q - default_joint_pos
  - name: joint_vel
    dim: 22
    unit: rad/s
    desc: 关节角速度
  - name: base_ang_vel
    dim: 3
    unit: rad/s
    desc: 骨盆 IMU 角速度，骨盆坐标系
  - name: projected_gravity
    dim: 3
    unit: '1'
    desc: 骨盆坐标系下的单位重力方向 R_pelvis^T [0, 0, -1]
  - name: actions
    dim: 22
    unit: '1'
    desc: 上一控制周期策略输出的 action（不是关节目标），回合开始为 0
goal:
  future_frames: 10
  frame_offset: Physical control step i uses command frame min(i+1,T-1); goal_window
    uses command frame..frame+K-1. Native reset already advances command frame to
    1.
  per_frame_features:
  - name: joint_pos
    dim: 22
    desc: 参考关节角减 default_joint_pos
  - name: joint_vel
    dim: 22
    desc: 参考关节角速度
  - name: projected_gravity
    dim: 3
    desc: 参考骨盆坐标系下的重力方向
  - name: root_ang_vel_b
    dim: 3
    desc: 参考骨盆角速度，骨盆坐标系
  - name: root_lin_vel_h
    dim: 3
    desc: 参考骨盆线速度，参考航向坐标系
  - name: root_height
    dim: 1
    desc: 参考骨盆高度（m）
  precomputed: 'deploy_motion.npz: goal_feat (T, 54)，已按上面顺序算好'
  anchor_ori:
    dim: 6
    desc: Reference anchor at command frame min(i+1,T-1); original BodyRef unchanged.
      Matched-reference initialization yields near-identity heading alignment.
    precomputed: 'deploy_motion.npz: anchor_quat_w (T, 4) wxyz'
motion:
  file: motion.npz
  frames: 1016
  fps: 50
start: '从参考首帧姿态（deploy_motion.npz: joint_pos[0]）缓慢插值到位后开始，last action = 0'
sim:
  timestep: 0.005
  integrator: 3
  cone: 0
  solver: 2
  iterations: 10
  ls_iterations: 20
  foot_friction: 0.6
stand_height: 0.42029336
