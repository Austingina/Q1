<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Q1 线路 B 控制</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;background:#0b1018;color:#eef4ff;touch-action:manipulation}
    main{max-width:520px;margin:auto;padding:18px 18px 170px}h1{font-size:22px;margin:0 0 4px}.route{color:#62ddb0;margin:0 0 12px}
    .card{background:#151e2c;border:1px solid #26364d;border-radius:16px;padding:14px;margin:12px 0}.state{display:flex;justify-content:space-between;gap:10px;align-items:center}
    #mode{background:#1f8f68;padding:6px 10px;border-radius:999px;font-weight:700}#message{color:#aebed3;margin-top:8px;min-height:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    button{min-height:58px;border:0;border-radius:14px;background:#2b4161;color:white;font-size:17px;font-weight:700}button:active,.held{background:#3d72ad;transform:scale(.98)}button:disabled{background:#25303e;color:#68788c;opacity:.72;transform:none}
    .primary{background:#2369a8}.dance{background:#7a46bb}.stop{background:#476070}.danger{background:#ad3434}.span2{grid-column:span 2}.hint{color:#8fa4bf;font-size:13px;line-height:1.5}.netbad{background:#8a2f2f!important}.drive{touch-action:none;user-select:none;-webkit-user-select:none}
    #safetyCard{border-color:#286e57}#poseCard{border-color:#3c587a}#poseCheck{width:100%;min-height:48px}.posepass{color:#62ddb0}.posefail{color:#ff9f76}#reconnect{width:100%;min-height:46px;background:#74531e}.drive-grid{grid-template-columns:repeat(2,1fr)}#estopBar{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:12px;background:linear-gradient(transparent,#0b1018 30%)}
    #estop{width:100%;min-height:70px;font-size:20px;box-shadow:0 0 0 2px #e06a6a}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <h1>Q1 线路 B 控制</h1><p class="route" id="routeText">安全模式：标准平趴 → 起身保持 → 平趴；行走/舞蹈事故锁定</p>
  <section class="card"><div class="state"><strong>控制状态</strong><span id="mode">连接中</span></div><div id="message">正在读取机器人状态…</div><div class="hint" id="telemetry"></div></section>
  <section class="card" id="poseCard"><div class="state"><strong>起身摆姿检查</strong><span id="poseState">尚未检查</span></div><p class="hint" id="poseText">只读取 IMU 和关节位置，不下发动作；仅在 LYING / DAMPED 状态可用。</p><button class="primary" id="poseCheck" data-action="pose_check">一键检查摆姿</button></section>
  <section class="card" id="safetyCard"><div class="state"><strong>断联保护</strong><span id="safetyState">正在连接</span></div><p class="hint" id="safetyText">只允许线路 B；无折叠按钮；网页断联会将速度归零并保持当前控制状态，不会自动阻尼。</p><button id="reconnect" hidden>重新连接网页控制</button></section>
  <section class="card grid"><button class="primary" data-action="getup">起身</button><button class="primary" data-action="walk" hidden>进入人工行走</button><button data-action="liedown">趴下</button><button class="dance" data-action="dance" hidden>跳舞（完整动作）</button><button class="stop span2" data-action="stand">正常停止 / 站立</button><p class="hint span2" id="danceHint" hidden>仅在 WALK 状态可用；点击后先自动将速度和转向归零、站稳，再播放约 20.3 秒完整舞蹈，结束后回到 WALK 站立。</p></section>
  <section class="card"><div class="grid drive-grid"><button class="drive" data-drive="fwd">按住前进</button><button class="drive" data-drive="back">按住后退</button><button class="drive" data-drive="left">按住左转</button><button class="drive" data-drive="right">按住右转</button><button class="drive" data-drive="fwd_left">按住前进左转</button><button class="drive" data-drive="fwd_right">按住前进右转</button></div><p class="hint" id="driveHint">每次只接受一个方向按钮；按住才移动，松手自动减速归零。后退不与转向组合。</p></section>
  <div id="estopBar"><button class="danger" id="estop">立即阻尼急停</button></div>
</main><script>
const token=new URLSearchParams(location.search).get('token')||'';const headers={'Content-Type':'application/json','X-Control-Token':token};
let activeDrive=null,activePointer=null;let controlOnline=false,estopLatched=false,heartbeatBusy=false,currentMode='STARTING',mobilityEnabled=false,danceEnabled=false,pageActive=!document.hidden,backend='?',maxForward=.30,maxBackward=.20,maxTurn=.50;
const driveAxes={fwd:[1,0],back:[-1,0],left:[0,1],right:[0,-1],fwd_left:[1,1],fwd_right:[1,-1]};
async function post(path,data){const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(data)});if(!r.ok)throw new Error((await r.json()).error||r.status);return r}
function showError(e){document.querySelector('#message').textContent=e?.message||'请求失败';if(e instanceof TypeError)networkBad()}
function clearDriveUi(){activeDrive=null;activePointer=null;document.querySelectorAll('.held').forEach(x=>x.classList.remove('held'))}
function networkBad(){document.querySelector('#mode').textContent='连接断开';document.querySelector('#mode').classList.add('netbad');controlOnline=false;clearDriveUi();updateControls()}
function updateControls(){const ready=controlOnline&&!estopLatched;document.querySelector('[data-action="pose_check"]').disabled=!ready||!['LYING','DAMPED'].includes(currentMode);document.querySelector('[data-action="getup"]').disabled=!ready||!['LYING','DAMPED'].includes(currentMode);const walk=document.querySelector('[data-action="walk"]');walk.hidden=!mobilityEnabled;walk.disabled=!mobilityEnabled||!ready||currentMode!=='STAND_HOLD';const dance=document.querySelector('[data-action="dance"]');dance.hidden=!danceEnabled;dance.disabled=!danceEnabled||!ready||currentMode!=='WALK';document.querySelector('#danceHint').hidden=!danceEnabled;document.querySelector('[data-action="liedown"]').disabled=!ready||!['STAND_HOLD','WALK'].includes(currentMode);document.querySelector('[data-action="stand"]').disabled=!ready||!['STAND_HOLD','WALK','STRAIGHTEN'].includes(currentMode);document.querySelectorAll('[data-drive]').forEach(b=>b.disabled=!mobilityEnabled||!ready||currentMode!=='WALK');const s=document.querySelector('#safetyState');s.textContent=estopLatched?'急停已触发':controlOnline?(mobilityEnabled?(danceEnabled?'保护在线 · 行走/转向/舞蹈':'保护在线 · 人工行走和转向'):'保护在线 · 行走锁定'):'速度已归零 · 状态保持中';s.style.color=controlOnline&&!estopLatched?'#62ddb0':'#ffc867';document.querySelector('#routeText').textContent=mobilityEnabled?(danceEnabled?'线路 B：摆姿检查 → 起身 → 零速交接 → 人工行走/转向 ↔ 舞蹈 → 平趴':'线路 B：摆姿检查 → 起身 → 零速交接 → 人工行走/转向 → 平趴'):'安全模式：摆姿检查 → 起身保持 → 平趴；行走/舞蹈事故锁定';const reconnect=document.querySelector('#reconnect');reconnect.hidden=controlOnline&&!estopLatched;reconnect.textContent=estopLatched?'急停后重新连接控制':'重新连接网页控制'}
function sendDrive(){const [ly,rx]=activeDrive?(driveAxes[activeDrive]||[0,0]):[0,0];post('/api/drive',{ly,rx}).catch(showError)}
async function heartbeat(){if(!pageActive||estopLatched||heartbeatBusy)return;heartbeatBusy=true;try{await post('/api/session',{active:true});controlOnline=true;updateControls()}catch(e){networkBad()}finally{heartbeatBusy=false}}
function disconnect(send=true){const was=controlOnline;controlOnline=false;clearDriveUi();updateControls();if(send&&was)post('/api/session',{active:false}).catch(networkBad)}
for(const b of document.querySelectorAll('[data-drive]')){const k=b.dataset.drive;const down=e=>{if(b.disabled||activePointer!==null)return;e.preventDefault();activeDrive=k;activePointer=e.pointerId;b.classList.add('held');b.setPointerCapture?.(e.pointerId);sendDrive()};const up=e=>{if(activePointer!==e.pointerId||activeDrive!==k)return;e.preventDefault();clearDriveUi();sendDrive()};b.addEventListener('pointerdown',down);for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up);b.addEventListener('contextmenu',e=>e.preventDefault())}
for(const b of document.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{if(b.disabled)return;clearDriveUi();sendDrive();post('/api/action',{action:b.dataset.action}).catch(showError)});
document.querySelector('#estop').addEventListener('click',async()=>{estopLatched=true;disconnect(false);updateControls();try{await post('/api/action',{action:'damp'})}catch(e){showError(e)}});document.querySelector('#reconnect').addEventListener('click',()=>{pageActive=true;estopLatched=false;updateControls();heartbeat()});
const directionText=d=>({forward:'前进',backward:'后退',turn_left:'左转',turn_right:'右转',forward_left:'前进左转',forward_right:'前进右转',stop:'停止',none:'无'})[d]||String(d||'无');
setInterval(()=>{if(activeDrive)sendDrive()},100);setInterval(heartbeat,100);setInterval(async()=>{try{const r=await fetch('/api/status',{headers});if(!r.ok)throw Error();const s=await r.json();if(s.route!=='B')throw Error('线路标识错误');currentMode=s.mode||'?';mobilityEnabled=Boolean(s.manual_drive_enabled??s.mobility_enabled);danceEnabled=Boolean(s.dance_enabled);backend=s.backend||'?';maxForward=Number(s.max_forward||.30);maxBackward=Number(s.max_backward||.20);maxTurn=Number(s.max_turn||.50);const m=document.querySelector('#mode');m.textContent=currentMode;m.classList.remove('netbad');if(!estopLatched)controlOnline=Boolean(s.control_online);document.querySelector('#message').textContent=s.message||'';document.querySelector('#telemetry').textContent=`vx ${Number(s.vx||0).toFixed(2)}  wz ${Number(s.wz||0).toFixed(2)}  输入 ${directionText(s.drive_input_direction)} [${Number(s.drive_input_axis||0).toFixed(2)}, ${Number(s.drive_input_turn_axis||0).toFixed(2)}]  upright ${Number(s.upright||0).toFixed(2)}${s.progress?'  '+s.progress:''}`;const danceSeconds=Number(s.dance_duration_s||20.3);document.querySelector('#danceHint').textContent=`仅在 WALK 状态可用；点击后先自动将速度和转向归零、站稳，再播放约 ${danceSeconds.toFixed(1)} 秒完整舞蹈，结束后回到 WALK 站立。`;const pc=s.pose_check||{};const ps=document.querySelector('#poseState');ps.textContent=pc.state==='pass'?'检查通过':pc.state==='fail'?'检查未通过':'尚未检查';ps.className=pc.state==='pass'?'posepass':pc.state==='fail'?'posefail':'';document.querySelector('#poseText').textContent=pc.state==='pass'||pc.state==='fail'?`upright ${Number(pc.upright||0).toFixed(3)}，最大关节差 ${Number(pc.max_joint_error||0).toFixed(3)} rad（${pc.worst_joint||'未知'}），折叠 ${pc.folded?'是':'否'}；${pc.reason||''}`:'只读取 IMU 和关节位置，不下发动作；仅在 LYING / DAMPED 状态可用。';document.querySelector('#driveHint').textContent=`每次只接受一个方向按钮；松手在 ${Number(s.drive_timeout||.25).toFixed(2)} 秒内归零。最近方向 ${directionText(s.last_nonzero_direction)}，持续 ${Number(s.last_drive_duration_s||0).toFixed(2)} 秒，归零原因 ${s.last_drive_stop_reason||'无'}。次数 前/后/左/右/前左/前右 ${Number(s.forward_press_count||0)}/${Number(s.backward_press_count||0)}/${Number(s.turn_left_press_count||0)}/${Number(s.turn_right_press_count||0)}/${Number(s.forward_left_press_count||0)}/${Number(s.forward_right_press_count||0)}。原仓库 speed-scale ${Number(s.speed_scale||.5).toFixed(1)}，${Number(s.control_hz||50).toFixed(0)} Hz，线速度斜坡 ${Number(s.linear_accel||1).toFixed(1)} m/s²，转向斜坡 ${Number(s.turn_accel||3).toFixed(1)} rad/s²。前进 ≤ ${maxForward.toFixed(2)} m/s，后退 ≤ ${maxBackward.toFixed(2)} m/s，转向 ≤ ${maxTurn.toFixed(2)} rad/s。`;const capability=mobilityEnabled?(backend==='real'?'真机人工行走和转向':'仿真人工行走和转向'):'行走不可用';document.querySelector('#safetyText').textContent=`${capability}，${danceEnabled?'完整舞蹈已启用':'舞蹈不可用'}；网页断开或 ${Number(s.heartbeat_timeout||1).toFixed(1)} 秒无心跳时，速度与转向归零并保持当前控制状态，只有显式急停才切阻尼。`;updateControls()}catch(e){networkBad()}},250);
updateControls();document.addEventListener('visibilitychange',()=>{pageActive=!document.hidden;if(!pageActive)disconnect(true);else heartbeat()});addEventListener('blur',()=>{pageActive=false;disconnect(true)});addEventListener('focus',()=>{pageActive=true;heartbeat()});addEventListener('pagehide',()=>{fetch('/api/drive?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:'{"ly":0,"rx":0}',keepalive:true});fetch('/api/session?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:'{"active":false}',keepalive:true})});
</script></body></html>
